name: Build LineageOS 22.1 for zeroltexx

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up swap space
      run: |
        sudo fallocate -l 10G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl erofs-utils flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev openjdk-11-jdk python3 python-is-python3

    - name: Install repo tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Configure Git
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"

    - name: Initialize and Sync Source
      run: |
        repo init -u https://github.com/project289/Lineageos-22-for-S6-EGDE-ZEROLTEXX.git -b main --git-lfs
        repo sync -c -j4 --force-sync --no-clone-bundle --no-tags

    - name: Build the ROM
      run: |
        source build/envsetup.sh
        lunch lineage_zeroltexx-userdebug
        make bacon -j4

    - name: Upload ROM
      uses: actions/upload-artifact@v4
      with:
        name: LineageOS-22.1-zeroltexx
        path: out/target/product/zeroltexx/*.zip
        if-no-files-found: warn

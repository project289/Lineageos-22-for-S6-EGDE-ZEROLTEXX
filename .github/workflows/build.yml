name: Build LineageOS 22.1 for zeroltexx

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up swap space
      run: |
        sudo fallocate -l 16G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl erofs-utils flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev openjdk-11-jdk python3 python-is-python3

    - name: Install repo tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Configure Git
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"

    - name: Initialize and Sync Source
      run: |
        repo init -u https://github.com/project289/s6_manifests.git -b main -m zeroltexx.xml
        sed -i '/<remote name="github"/d' .repo/manifests/zeroltexx.xml
        sed -i '/zero-common/s/revision="lineage-21.0"/revision="cm-14.1"/' .repo/manifests/zeroltexx.xml
        repo sync -c -j4 --force-sync --no-clone-bundle --no-tags

    - name: Apply fixes
      run: |
        echo -e 'COMMON_LUNCH_CHOICES := lineage_zeroltexx-userdebug lineage_zeroltexx-user lineage_zeroltexx-eng\nPRODUCT_MAKEFILES := $(LOCAL_DIR)/lineage_zeroltexx.mk' > device/samsung/zeroltexx/AndroidProducts.mk
        sed -i 's/PRODUCT_NAME := zeroltexx/PRODUCT_NAME := lineage_zeroltexx/' device/samsung/zeroltexx/lineage_zeroltexx.mk
        sed -i '/add_lunch_combo/d' device/samsung/zeroltexx/vendorsetup.sh
        sed -i '43s/^/#/' device/samsung/zero-common/zero-common.mk
        sed -i '/samsung_slsi-cm/s/^/#/' device/samsung/zero-common/zero-common.mk
        find device/samsung -name 'BoardConfig*.mk' -exec sed -i 's/TARGET_2ND_ARCH_VARIANT := armv7-a-neon/TARGET_2ND_ARCH_VARIANT := armv8-a/g' {} \;
        mkdir -p device/samsung/zerolte
        cp device/samsung/zeroltexx/BoardConfig.mk device/samsung/zerolte/BoardConfig.mk
        sed -i '46s/^/#/' device/samsung/zerolte/BoardConfig.mk
        sed -i '/libcamera_client/d' device/samsung/universal7420-common/libshims/libstagefright/Android.bp
        mkdir -p hardware/samsung_slsi/exynos hardware/samsung_slsi/interfaces hardware/samsung_slsi/graphics hardware/samsung_slsi/tee hardware/samsung_slsi/openmax hardware/samsung_slsi/config
        find hardware/samsung_slsi/linaro_* -name 'Android.bp' -delete 2>/dev/null || true

    - name: Build the ROM
      run: |
        source build/envsetup.sh
        export TARGET_PRODUCT=lineage_zeroltexx
        export TARGET_BUILD_VARIANT=userdebug
        export TARGET_DEVICE=zeroltexx
        export TARGET_RELEASE=aosp_current
        make bacon -j4

    - name: Upload ROM
      uses: actions/upload-artifact@v4
      with:
        name: LineageOS-22.1-zeroltexx
        path: out/target/product/zeroltexx/*.zip
        if-no-files-found: warn
